<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boundary Function Paradox Reasoning</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <p class="kicker">Prototype: symbolic reasoning system</p>
        <h1>((0))) ~ INFINITY</h1>
        <p class="subtitle">
          A lightweight browser model showing how a localized seed expands toward
          an unbounded logical horizon.
        </p>
      </header>

      <main class="grid">
        <section class="panel">
          <h2>Boundary Control</h2>

          <label for="epsilonRange">Local error margin x</label>
          <div class="range-row">
            <input id="epsilonRange" type="range" min="0.02" max="1" step="0.01" value="0.18" />
            <output id="epsilonValue">0.18</output>
          </div>

          <label for="depthRange">Propagation depth</label>
          <div class="range-row">
            <input id="depthRange" type="range" min="0" max="7" step="1" value="4" />
            <output id="depthValue">4</output>
          </div>

          <div class="metrics">
            <div class="metric-box">
              <span class="label">Reciprocal</span>
              <strong id="reciprocalValue">5.56</strong>
            </div>
            <div class="metric-box">
              <span class="label">Reach</span>
              <strong id="reachValue">Moderate</strong>
            </div>
          </div>
        </section>

        <section class="panel">
          <h2>Reasoning Archetype</h2>
          <div id="archetype" class="archetype" aria-live="polite"></div>
          <div id="summary" class="summary"></div>
        </section>

        <section class="panel chart-panel">
          <h2>Boundary Function</h2>
          <canvas id="graphCanvas" width="420" height="240"></canvas>
          <div class="formula">
            lim(x → 0+) 1/x = ∞
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
